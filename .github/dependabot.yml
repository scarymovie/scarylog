version: 2

# Only `github-actions`.
#
# A `gomod` entry would be dead weight: Dependabot only opens PRs for modules
# that are already in go.mod's require block, and scarylog's require block is
# empty by design (stdlib only), so the entry could never fire. The invariant is
# watched by the "Stdlib-only guard" step in .github/workflows/ci.yml instead.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One PR for all actions. Every `uses:` is pinned to a commit SHA with a
    # `# vX.Y.Z` comment; Dependabot updates both the SHA and the comment.
    groups:
      github-actions:
        patterns:
          - "*"
