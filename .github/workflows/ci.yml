name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # go.mod declares `go 1.26`; CI runs exactly that line.
  GO_VERSION: "1.26"
  # golangci-lint v2 is mandatory: v1 refuses a module targeting Go 1.26
  # ("the Go language version used to build golangci-lint is lower than the
  # targeted Go version"). v2.9.0 is the first release built with Go 1.26.
  # Pin it explicitly — the action otherwise resolves a floating `latest`.
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  test:
    name: test (ubuntu-latest, Go 1.26)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race          : the context/handler paths are concurrent by design.
      # -covermode=atomic : required to combine coverage with -race.
      # -count=1       : never serve a cached result.
      # -shuffle=on    : test order must not be load-bearing.
      # No -coverpkg   : it leaves the merged total unchanged and only distorts
      #                  the per-package percentages.
      - name: Test (race, shuffle, coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic -count=1 -shuffle=on -timeout=5m

      # Not a performance gate — proof that the benchmarks still compile and run.
      - name: Benchmarks (smoke run)
        run: go test ./... -run='^$' -bench=. -benchtime=1x

      - name: Coverage summary
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')"
          {
            echo "### Coverage"
            echo
            echo "Total: **${total}**"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # scarylog is stdlib-only. `go mod tidy` must be a no-op, and go.mod must
      # never grow a require block at all.
      - name: Stdlib-only guard
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum
          ! grep -qE '^[[:space:]]*require' go.mod

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This action checks the repository out and installs Go itself.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          check-latest: true
          go-package: ./...
